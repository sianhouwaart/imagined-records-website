<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Artist Creation Brief — Imagined Records</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0c0e;color:#f1f0eb;font:16px/1.55 system-ui,sans-serif}main{max-width:790px;margin:auto;padding:40px 22px 90px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #343434;padding-bottom:20px;font-size:12px;letter-spacing:.17em}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(42px,8vw,76px);line-height:1.08;margin:55px 0 20px}h2{font-size:36px}p,.muted{color:#aaa}label{display:block;margin-bottom:10px;font-weight:600}fieldset{border:0;padding:0;margin:28px 0 36px}legend{font-weight:600;margin-bottom:12px}input[type=text],textarea{width:100%;background:#17191c;color:white;border:1px solid #555;border-radius:6px;padding:14px;font:inherit}textarea{min-height:100px}.option{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid #3c3c3c;border-radius:7px;margin:8px 0;cursor:pointer;font-weight:400}.option:has(input:checked){border-color:#f1f0eb;background:#242629}button{background:#f1f0eb;color:#0b0c0e;border:0;border-radius:5px;padding:14px 22px;font-weight:700;cursor:pointer}button.secondary{background:transparent;color:white;border:1px solid #666}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:12px;justify-content:space-between;margin-top:35px}.progress{height:3px;background:#303030;margin-top:24px}.bar{height:100%;background:#f1f0eb;transition:width .2s}.step{color:#aaa;font-size:12px;letter-spacing:.12em;margin-top:25px}#notice{margin-top:20px}small{color:#aaa}@media(max-width:600px){main{padding-top:22px}.actions{flex-wrap:wrap}}</style></head><body><main><header><strong>IMAGINED RECORDS</strong><span>INTERNAL / ARTIST 003</span></header><h1>Artist Creation <em>Brief.</em></h1><p>Geef vorm aan onze volgende artiest. Je antwoorden worden veilig verwerkt en gedeeld met Imagined Records.</p><div class="progress"><div id="bar" class="bar"></div></div><div id="app"></div><p id="notice" role="status"></p></main><script>const sections=[["Muzikale identiteit",[["genre","Primair genre",["Indie folk","Pop","Hip-hop","Alternative R&B","Rock","Electronic","Country","Soul","Anders"]],["subgenre","Aanvullende invloeden",["Americana","Synthpop","Trap","Jazz","Blues","Lo-fi","Afrobeats","Dance","Anders"],"multi"],["tempo","Algemene energie",["Intiem en rustig","Midtempo","Energiek","Afwisselend"]],["sound","Productiestijl",["Akoestisch en organisch","Modern en strak","Rauw en ongepolijst","Cinematisch","Experimenteel"]],["instruments","Kenmerkende instrumenten",["Gitaar","Piano","Synthesizers","Drums","Strijkers","Bas","Elektronische beats"],"multi"],["references","Muzikale referenties of voorbeelden",null]]],["Artiestenpersona",[["identity","Artiestenidentiteit",["Man","Vrouw","Androgyn / genderneutraal","Nog open"]],["age","Leeftijdsindruk",["18–24","25–34","35–44","45+","Tijdloos / onbepaald"]],["origin","Culturele of geografische achtergrond",null],["personality","Karaktereigenschappen",["Mysterieus","Warm","Rebels","Kwetsbaar","Zelfverzekerd","Speels","Introvert","Uitgesproken"],"multi"],["story","Achtergrondverhaal",null],["name","Artiestennaam (indien al bedacht)",null]]],["Stem en performance",[["vocal","Type stem",["Laag en warm","Helder en licht","Rauw en hees","Zacht en luchtig","Krachtig","Rap / gesproken","Mix"]],["delivery","Vocale uitvoering",["Ingetogen","Emotioneel","Technisch en gepolijst","Nonchalant","Intens en expressief"]],["language","Taal",["Engels","Nederlands","Spaans","Meertalig","Anders"]],["accent","Accent of stemkleur",null],["features","Duetten of gastartiesten",["Nee, solo","Soms","Regelmatig","Nog open"]]]],["Tekst en thematiek",[["themes","Belangrijkste thema's",["Liefde","Verlies","Ambitie","Nostalgie","Identiteit","Nachtleven","Hoop","Maatschappij","Vrijheid"],"multi"],["tone","Tekstuele toon",["Poëtisch","Direct en eerlijk","Verhalend","Donker","Optimistisch","Ironisch"]],["explicit","Expliciete teksten",["Nee","Af en toe","Ja, indien passend"]],["narrative","Vertelperspectief",["Ik-persoon","Verhalen over anderen","Afwisselend"]],["message","Wat moet de luisteraar voelen?",null]]],["Visuele identiteit",[["aesthetic","Visuele stijl",["Cinematisch","Minimalistisch","Streetwear","Vintage","High fashion","Natuurlijk","Futuristisch","Donker en mysterieus"]],["palette","Kleurenpalet",["Zwart-wit","Warme aardetinten","Koele tinten","Fel en contrastrijk","Pastel","Nog open"]],["face","Zichtbaarheid gezicht",["Volledig zichtbaar","Gedeeltelijk verborgen","Anoniem / silhouet","Afhankelijk van campagne"]],["setting","Typische omgeving",["Stad","Natuur","Studio","Podium","Thuis","Abstracte wereld"],"multi"],["fashion","Kledingstijl en herkenbare details",null],["visualrefs","Visuele inspiratie / referenties",null]]],["Debuut en ambities",[["first","Eerste release",["Single","EP","Album","Nog open"]],["trackcount","Gewenst aantal nummers",["1","3–5","6–8","9+"]],["audience","Doelgroep",["18–24","25–34","35–44","45+","Breed publiek"],"multi"],["platform","Belangrijkste kanalen",["Spotify","TikTok","Instagram","YouTube","Apple Music"],"multi"],["priority","Belangrijkste succescriterium",["Artistieke kwaliteit","Luisteraarsgroei","Virale aandacht","Sterke merkidentiteit","Commerciële opbrengst"]],["musthave","Wat mag absoluut niet ontbreken?",null],["avoid","Wat moeten we vermijden?",null],["other","Overige opmerkingen",null]]]];const storageKey="ir-artist-brief-draft-v1";let answers={};try{answers=JSON.parse(localStorage.getItem(storageKey)||"{}")}catch{}let step=0;const app=document.getElementById("app");const notice=document.getElementById("notice");function save(){localStorage.setItem(storageKey,JSON.stringify(answers))}function render(){notice.textContent="";document.getElementById("bar").style.width=((step+1)/(sections.length+1)*100)+"%";if(step===sections.length){app.innerHTML='<p class="step">CONTROLE / VERSTUREN</p><h2>Controleer je antwoorden</h2><p>Je kunt teruggaan om antwoorden te wijzigen.</p><div id="summary"></div><div class="actions"><button class="secondary" id="back">Terug</button><button id="submit">Verstuur brief</button></div>';document.getElementById("summary").textContent=sections.flatMap(s=>s[1]).map(q=>q[1]+": "+(Array.isArray(answers[q[0]])?answers[q[0]].join(", "):answers[q[0]]||"—")).join("\n");document.getElementById("summary").style.whiteSpace="pre-line";document.getElementById("back").onclick=()=>{step--;render()};document.getElementById("submit").onclick=submit;return}const section=sections[step];app.innerHTML="";const caption=document.createElement("p");caption.className="step";caption.textContent="HOOFDSTUK "+(step+1)+" / "+sections.length;app.append(caption);const title=document.createElement("h2");title.textContent=section[0];app.append(title);if(step===0){const field=document.createElement("fieldset");field.innerHTML='<label for="respondent">Jouw naam (optioneel)</label><input type="text" id="respondent" maxlength="120">';app.append(field);field.querySelector("input").value=answers.respondent||"";field.querySelector("input").oninput=e=>{answers.respondent=e.target.value;save()}}section[1].forEach(q=>{const field=document.createElement("fieldset");const legend=document.createElement("legend");legend.textContent=q[1];field.append(legend);if(!q[2]){const input=document.createElement("textarea");input.maxLength=1500;input.value=answers[q[0]]||"";input.oninput=e=>{answers[q[0]]=e.target.value;save()};field.append(input)}else{q[2].forEach((option,i)=>{const label=document.createElement("label");label.className="option";const input=document.createElement("input");input.type=q[3]==="multi"?"checkbox":"radio";input.name=q[0];input.value=option;input.checked=q[3]==="multi"?(answers[q[0]]||[]).includes(option):answers[q[0]]===option;input.onchange=()=>{if(q[3]==="multi"){const values=new Set(answers[q[0]]||[]);input.checked?values.add(option):values.delete(option);answers[q[0]]=[...values]}else answers[q[0]]=option;save()};label.append(input,document.createTextNode(option));field.append(label)})}app.append(field)});const actions=document.createElement("div");actions.className="actions";const back=document.createElement("button");back.className="secondary";back.textContent="Vorige";back.disabled=step===0;back.onclick=()=>{step--;render()};const next=document.createElement("button");next.textContent=step===sections.length-1?"Controleer antwoorden":"Volgende";next.onclick=()=>{step++;render();window.scrollTo(0,0)};actions.append(back,next);app.append(actions)}async function submit(){const btn=document.getElementById("submit");btn.disabled=true;notice.textContent="Versturen...";try{const response=await fetch("/api/artist-brief",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({respondent:answers.respondent||"",answers})});if(!response.ok)throw Error("Verzenden mislukt ("+response.status+")");localStorage.removeItem(storageKey);app.innerHTML="<h2>Bedankt. Je brief is verstuurd.</h2><p>Imagined Records heeft je inzending ontvangen.</p>";notice.textContent=""}catch(e){notice.textContent=e.message+". Probeer opnieuw.";btn.disabled=false}}render();</script></body></html>
